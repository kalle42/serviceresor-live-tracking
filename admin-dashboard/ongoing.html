<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#152720">
    <title>Pågående resor · Serviceresor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ongoing.css">
</head>
<body>
    <header class="gallery-header">
        <a class="back-link" href="/">← Driftcentral</a>
        <div>
            <p>Serviceresor / Liveöversikt</p>
            <h1>Pågående resor</h1>
        </div>
        <div class="header-status"><span class="pulse"></span><strong id="ongoing-count">0</strong><small>aktiva kartor</small></div>
    </header>

    <main>
        <div class="toolbar">
            <p>Alla aktiva kartor uppdateras automatiskt.</p>
            <div><span id="last-update">Inte synkad</span><button id="refresh-button">Uppdatera</button></div>
        </div>
        <section id="ongoing-gallery" class="ongoing-gallery" aria-live="polite">
            <div class="empty-state">Läser pågående resor...</div>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="ongoing.js"></script>
</body>
</html>
